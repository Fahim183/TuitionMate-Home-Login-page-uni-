<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | TuitionMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <header class="navbar">
    <a class="logo" href="index.html"><i class="fa-solid fa-graduation-cap"></i><span>TuitionMate</span></a>
    <nav class="nav-links" aria-label="Main navigation"><a href="index.html">Home</a><a href="index.html#subjects">Courses</a><a href="index.html#features">About</a><a href="index.html#contact">Contact</a></nav>
    <div class="auth-buttons"><button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode"><i class="fa-solid fa-moon"></i></button><a class="btn-outline" href="login.html">Login</a><a class="btn-primary" href="signup.html">Sign Up</a></div>
    <div class="mobile-menu"><button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-menu-panel"><i class="fa-solid fa-bars"></i></button><nav class="mobile-menu-panel" id="mobile-menu-panel" aria-label="Mobile navigation"><a href="index.html">Home</a><a href="index.html#subjects">Courses</a><a href="index.html#features">About</a><a href="index.html#contact">Contact</a><a href="login.html">Login</a><a href="signup.html">Sign Up</a></nav></div>
  </header>

  <main class="login-main">
    <div class="space-bg" aria-hidden="true">
      <canvas id="starfield"></canvas>
      <div class="space-horizon"></div>
    </div>
    <div class="login-container">
      <section class="login-card" aria-labelledby="login-title">
        <a class="card-logo" href="index.html"><i class="fa-solid fa-graduation-cap"></i><span>TuitionMate</span></a>
        <h1 id="login-title">Reset Password</h1>
        <p class="card-subtitle">Enter your email and we'll send you a reset link.</p>
        <div class="success-message" id="form-success" role="status" aria-live="polite" hidden><i class="fa-solid fa-circle-check"></i> <span id="form-success-text"></span></div>
        <form action="#" method="get" id="forgot-form" novalidate>
          <div class="form-group"><label class="form-label" for="email">Email Address</label><div class="input-wrapper"><i class="fa-regular fa-envelope"></i><input id="email" name="email" type="email" class="form-input" placeholder="Enter your email" autocomplete="email" required aria-describedby="email-error"></div><p class="error-message" id="email-error"></p></div>
          <button type="submit" class="btn-login-submit">Send Reset Link <i class="fa-solid fa-arrow-right"></i></button>
        </form>
        <p class="signup-prompt"><a href="login.html">← Back to Login</a></p>
        <p class="demo-note"><i class="fa-solid fa-shield-halved"></i> Student project demo — no email is actually sent.</p>
      </section>
    </div>
  </main>
  <footer class="login-footer"><a href="index.html">← Back to Home</a><span>Learn Today, Lead Tomorrow.</span><span>&copy; 2026 TuitionMate</span></footer>
  <div class="color-picker" id="color-picker">
    <button type="button" class="color-picker-toggle" id="color-picker-toggle" aria-label="Change accent colour" aria-expanded="false" aria-controls="color-options"><i class="fa-solid fa-palette"></i></button>
    <div class="color-options" id="color-options" role="group" aria-label="Accent colour" hidden>
      <button type="button" class="color-swatch swatch-blue" data-color="blue" aria-label="Blue" aria-pressed="true"></button>
      <button type="button" class="color-swatch swatch-green" data-color="green" aria-label="Green" aria-pressed="false"></button>
      <button type="button" class="color-swatch swatch-purple" data-color="purple" aria-label="Purple" aria-pressed="false"></button>
      <button type="button" class="color-swatch swatch-orange" data-color="orange" aria-label="Orange" aria-pressed="false"></button>
      <button type="button" class="color-swatch swatch-rose" data-color="rose" aria-label="Rose" aria-pressed="false"></button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
